<mat-card>
    <h2>{{isineditmode? 'Update Todo' : 'Add Todo'}}</h2>
    <form #todoform="ngForm" (ngSubmit)="onTodoadd()">
        <div class="form-group">
            <label for="todoItem">TodoItem</label>
            <input type="text" name="title" ngModel required class="form-control">
        </div>

        <button *ngIf="!isineditmode" [disabled]="todoform.invalid" mat-raised-button color="primary" class="w-100">Add Todo</button>
        <button 
        type="button"
        (click)="onUpdatetodo()"
        *ngIf="isineditmode" [disabled]="todoform.invalid" mat-raised-button color="primary" class="w-100">Update Todo</button>
    </form>
</mat-card>
