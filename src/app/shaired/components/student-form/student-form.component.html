<mat-card>
    <h1>{{isineditmode ? 'Updated Student' : 'Add Student'}}</h1>
    <form #stdform="ngForm" (ngSubmit)="onAddStd()">
        <div class="form-group">
            <label for="fname" class="text-primary ">First Name<sup>*</sup></label>
            <input ngModel required name="fname" type="text" class="form-control">
        </div>
        <div class="form-group">
            <label for="lname" class="text-primary ">Last Name<sup>*</sup></label>
            <input ngModel required name="lname" type="text" class="form-control">
        </div>
        <div class="form-group">
            <label for="email" class="text-primary ">Email<sup>*</sup></label>
            <input ngModel required name="email" type="text" class="form-control">
        </div>
        <div class="form-group">
            <label for="contact" class="text-primary ">Contact<sup>*</sup></label>
            <input ngModel required name="contact" type="text" class="form-control">
        </div>
        <div class="form-group">
            <label for="isConfirmed" class="text-primary ">Is Active<sup>*</sup></label>
            <select name="isConfirmed" ngModel required class="form-control">
                <option [ngValue]="true">Yes</option>
                <option [ngValue]="false">No</option>
            </select>
        </div>
        <button 
        *ngIf="!isineditmode"
        [disabled]="stdform.invalid" class="w-100" mat-raised-button color="primary">Add Student</button>
        <button 
        (click)="onUpdatestd()"
        *ngIf="isineditmode"
        [disabled]="stdform.invalid" class="w-100" type="button" mat-raised-button color="primary">Updated Student</button>
    </form>
</mat-card>
